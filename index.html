<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syed Zain Hussain</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Syed Zain Hussain, a Karachi-based graphic designer, video editor and 2D animator with 7+ years of experience in branding, motion graphics and ad creatives.">
<meta property="og:title" content="Syed Zain Hussain | Graphic Designer, Video Editor, 2D Animator">
<meta property="og:description" content="Brand identity, motion graphics, 2D animation and ad creatives. 7+ years of experience. Available for freelance and remote work.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: an editor's desk on a living surface. One fixed canvas of flowing contour lines
   runs the full height of the page and moves with the scroll. Work floats on it with no card
   backgrounds, hairline guides, crop marks and one ultramarine accent. */
:root {
  --bg: #EDEEF0;
  --surface: #E2E4E8;
  --ink: #0F1115;
  --mute: #4B515D;
  --line: #C3C7CF;
  --accent: #2E35E6;
  --on-accent: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0D10; --surface: #181A1F; --ink: #ECEDEF; --mute: #A3A9B4;
    --line: #2C2F37; --accent: #8E97FF; --on-accent: #0C0D10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0D10; --surface: #181A1F; --ink: #ECEDEF; --mute: #A3A9B4;
  --line: #2C2F37; --accent: #8E97FF; --on-accent: #0C0D10; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
#h1:focus { outline: none; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1.0625rem/1.6 var(--font-body);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  -webkit-font-smoothing: antialiased;
  text-shadow: 0 0 14px color-mix(in srgb, var(--bg) 85%, transparent), 0 0 4px color-mix(in srgb, var(--bg) 60%, transparent);
}
.btn, .chip, input, select, textarea, .lb, .tags span { text-shadow: none; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 45;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: block; }
#prog { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); z-index: 41; pointer-events: none; }
.w { max-width: 1280px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 14px; z-index: 60; }
.skip:focus { left: 8px; }
.mono { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }

/* header */
.site {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(var(--gutter-l) * -1) calc(var(--gutter-r) * -1);
  padding-inline: var(--gutter-l) var(--gutter-r);
}
.site .w { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.brand { font: 700 1.05rem var(--font-display); letter-spacing: -0.02em; text-decoration: none; }
.nav { display: flex; align-items: center; gap: clamp(14px, 3vw, 32px); }
.nl { text-decoration: none; font-size: 0.95rem; font-weight: 500; padding-block: 4px; border-bottom: 1.5px solid transparent; transition: border-color .2s; }
.nl:hover { border-color: var(--ink); }
.nl[aria-current="page"] { border-color: var(--accent); }
.tg { width: 36px; height: 36px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.tg:hover { border-color: var(--ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; font: 600 0.95rem var(--font-body); padding: 14px 22px; text-decoration: none; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .25s ease-out; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn .ar { transition: transform .2s; }
.btn:hover .ar { transform: translateX(4px); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }

/* views and reveal */
.view { padding-block: clamp(32px, 6vw, 72px) 0; animation: vin .5s ease both; }
@keyframes vin { from { opacity: 0; } to { opacity: 1; } }
.rv { opacity: 0; transform: translateY(26px); }
.rv.in { opacity: 1; transform: none; transition: opacity .8s cubic-bezier(.2,.7,.2,1) var(--d, 0ms), transform .8s cubic-bezier(.2,.7,.2,1) var(--d, 0ms); }

/* hero */
.hero h1 { font-size: clamp(3.3rem, 13.2vw, 11.5rem); font-weight: 800; line-height: 0.88; letter-spacing: -0.05em; margin-top: 18px; }
.hero h1 > span { display: block; }
.hero h1 .o { color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.ch { display: inline-block; transition: transform .35s cubic-bezier(.2,.7,.2,1), color .25s; }
.ch:hover { transform: translateY(-0.07em); color: var(--accent); }
.hero-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
.tc { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.06em; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(24px, 5vw, 80px); margin-top: clamp(28px, 5vw, 56px); padding-top: 28px; border-top: 1px solid var(--line); align-items: end; }
.lede { font-size: clamp(1.2rem, 2.4vw, 1.7rem); line-height: 1.35; letter-spacing: -0.01em; max-width: 30ch; }
.big7 { display: flex; align-items: baseline; gap: 14px; justify-content: flex-end; }
.big7 b { font: 800 clamp(4.5rem, 11vw, 9rem)/0.8 var(--font-display); letter-spacing: -0.06em; color: var(--accent); }
.big7 span { max-width: 14ch; font-size: 0.95rem; color: var(--mute); line-height: 1.3; }
.hero .row { margin-top: 28px; }

/* marquee words */
.mq { margin-block: clamp(40px, 7vw, 88px) 0; border-block: 1px solid var(--line); overflow: hidden; margin-inline: calc(var(--gutter-l) * -1) calc(var(--gutter-r) * -1); }
.mq-t { display: flex; width: max-content; animation: mq 38s linear infinite; }
.mq:hover .mq-t { animation-play-state: paused; }
.mq-t span { font: 700 clamp(1.4rem, 3vw, 2.2rem) var(--font-display); letter-spacing: -0.02em; padding: 16px 28px; white-space: nowrap; }
.mq-t span::after { content: "/"; color: var(--accent); margin-left: 56px; }
@keyframes mq { to { transform: translateX(-50%); } }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; padding-top: clamp(40px, 6vw, 72px); }
.stat b { display: block; font: 800 clamp(3.8rem, 9.6vw, 8.5rem)/0.9 var(--font-display); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.stat b .num { display: inline; font: inherit; color: inherit; max-width: none; margin: 0; }
.stat b i { font-style: normal; color: var(--accent); }
.stat > span { display: block; margin-top: 12px; color: var(--mute); font-size: 0.95rem; max-width: 22ch; line-height: 1.35; }

/* sections */
.sec { padding-top: clamp(56px, 9vw, 112px); }
.sec-h { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(24px, 4vw, 44px); }
.sec-h h2 { font-size: clamp(2rem, 5vw, 3.6rem); }

/* work cards: no card background, artwork floats on the page */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: clamp(24px, 3.4vw, 44px) clamp(16px, 2.4vw, 28px); }
.card { text-decoration: none; display: block; min-width: 0; }
.plate { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; container-type: size; background: none; }
.plate::before, .plate::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--mute); opacity: .7; z-index: 3; transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .2s; }
.plate::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
.plate::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
.card:hover .plate::before { transform: translate(-4px, -4px); border-color: var(--accent); }
.card:hover .plate::after { transform: translate(4px, 4px); border-color: var(--accent); }
.plate .pc, .plate .pk { position: absolute; z-index: 3; font: 400 0.7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.plate .pc { top: 12px; left: 34px; }
.plate .pk { bottom: 12px; right: 34px; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.art .s { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.art .p { fill: var(--bg); stroke: var(--ink); stroke-width: 1.6; }
.art .m { fill: none; stroke: var(--mute); stroke-width: 1; stroke-dasharray: 3 5; }
.art .f { fill: var(--accent); }
.art .g { fill: var(--ink); }
.art .ft { fill: none; stroke: var(--accent); stroke-width: 2.4; }
.card:hover .art { transform: scale(1.05); }

/* fanned artwork, sized from the plate with container units */
.fan { position: absolute; inset: 0; transition: transform .25s ease-out; transform: perspective(900px) rotateY(calc(var(--tx, 0) * 9deg)) rotateX(calc(var(--ty, 0) * -7deg)); }
.fan .it { position: absolute; left: 50%; top: 50%; aspect-ratio: var(--ar); height: min(78cqh, calc(var(--wf) * 100cqw / var(--ar))); background: #fff; z-index: var(--z, 1);
  height: 72%; transform: translate(calc(-50% + var(--ox) * 170%), calc(-50% + var(--oy) * 100%)) rotate(var(--r));
  transform: translate(-50%, -50%) translate(calc(var(--ox) * 100cqw), calc(var(--oy) * 100cqh)) rotate(var(--r));
  box-shadow: 0 18px 36px rgba(8, 10, 20, .28), 0 0 0 1px rgba(8, 10, 20, .10); transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.fan .it img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:hover .fan .it, .cs-visual .plate:hover .fan .it { transform: translate(-50%, -50%) translate(calc(var(--ox) * 128cqw), calc(var(--oy) * 110cqh)) rotate(calc(var(--r) * 1.5)) scale(1.03); }
.cm { display: flex; justify-content: space-between; gap: 16px; align-items: start; padding-top: 14px; }
.cm h3 { font-size: 1.35rem; letter-spacing: -0.02em; }
.cm p { color: var(--mute); font-size: 0.92rem; margin-top: 4px; }
.cm .ar { font-size: 1.3rem; transition: transform .25s; color: var(--accent); }
.card:hover .cm .ar { transform: translate(4px, -4px); }
.feat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 2.6vw, 32px); }
.feat .card.big { grid-column: 1 / -1; }
.feat .card.big .plate { aspect-ratio: 21 / 9; }
.feat .card.big .cm h3 { font-size: clamp(1.6rem, 3vw, 2.4rem); }

/* showreel wall */
.wall { display: grid; gap: 14px; overflow: hidden; margin-inline: calc(var(--gutter-l) * -1) calc(var(--gutter-r) * -1); }
.wr { display: flex; width: max-content; animation: wall 80s linear infinite; --h: clamp(150px, 21vw, 250px); }
.wr.rev { animation-direction: reverse; animation-duration: 95s; }
.wall:hover .wr { animation-play-state: paused; }
.set { display: flex; gap: 14px; padding-right: 14px; }
@keyframes wall { to { transform: translateX(-50%); } }
.wi { position: relative; flex: none; height: var(--h); padding: 0; border: 0; background: none; cursor: pointer; overflow: hidden; box-shadow: 0 10px 24px rgba(8, 10, 20, .22), 0 0 0 1px rgba(8, 10, 20, .08); transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s; }
.wi img, .wi video { height: 100%; width: auto; display: block; background: #fff; }
.wi:hover { transform: translateY(-6px) scale(1.02); z-index: 2; }
.wi span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 10px; font: 400 .7rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(8, 10, 20, .72)); opacity: 0; transition: opacity .25s; }
.wi:hover span, .wi:focus-visible span { opacity: 1; }
.wi.v::before { content: "\25B6"; position: absolute; top: 10px; right: 10px; z-index: 2; font-size: .6rem; color: #fff; background: rgba(8, 10, 20, .6); padding: 5px 7px; line-height: 1; }

/* client index */
.ixl { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ix { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.1fr) auto 24px; gap: 16px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: padding-left .3s cubic-bezier(.2,.7,.2,1), color .2s; }
.ix:hover, .ix:focus-visible { padding-left: 16px; color: var(--accent); }
.ix b { font: 700 clamp(1.35rem, 3.2vw, 2.5rem) var(--font-display); letter-spacing: -0.03em; line-height: 1.05; }
.ix span { color: var(--mute); font-size: .95rem; }
.ix i { font-style: normal; font-family: var(--font-mono); font-size: .8rem; color: var(--mute); }
.ix .ar { transition: transform .25s; }
.ix:hover .ar { transform: translateX(4px); }
#pv { position: fixed; left: 0; top: 0; width: 260px; z-index: 35; pointer-events: none; opacity: 0; transform: translate(-999px, -999px); transition: opacity .2s; box-shadow: 0 24px 48px rgba(8, 10, 20, .35), 0 0 0 1px rgba(8, 10, 20, .1); background: #fff; }
#pv.on { opacity: 1; }
#pv img { width: 100%; height: auto; }
#cur { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 1.5px solid var(--accent); border-radius: 50%; z-index: 70; pointer-events: none; opacity: 0; transition: width .25s, height .25s, margin .25s, background .25s, opacity .2s; display: grid; place-items: center; }
#cur.vis { opacity: 1; }
#cur.big { width: 84px; height: 84px; margin: -42px 0 0 -42px; background: color-mix(in srgb, var(--accent) 88%, transparent); }
#cur span { font: 500 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--on-accent); opacity: 0; transition: opacity .2s; }
#cur.big span { opacity: 1; }
@media (hover: none), (pointer: coarse) { #cur, #pv { display: none; } }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
.chip { font: 500 0.9rem var(--font-body); padding: 9px 16px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--ink); cursor: pointer; border-radius: 999px; transition: border-color .2s, background .2s, transform .2s; }
.chip:hover { border-color: var(--ink); transform: translateY(-2px); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { color: var(--mute); margin-left: 6px; font-family: var(--font-mono); }
.chip[aria-pressed="true"] small { color: var(--bg); opacity: .7; }
.page-h h1 { font-size: clamp(2.8rem, 9vw, 7.5rem); font-weight: 800; letter-spacing: -0.045em; }
.page-h p { margin-top: 20px; max-width: 52ch; color: var(--mute); font-size: 1.15rem; }
.page-h { margin-bottom: clamp(28px, 5vw, 52px); }

/* capabilities */
.caps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.caps li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px 32px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: baseline; transition: padding-left .25s; }
.caps li:hover { padding-left: 14px; }
.caps b { font: 700 clamp(1.3rem, 2.6vw, 2rem) var(--font-display); letter-spacing: -0.025em; }
.caps span { color: var(--mute); }

/* cta */
.cta { margin-top: clamp(64px, 10vw, 128px); padding-block: clamp(40px, 7vw, 88px); border-top: 1px solid var(--line); display: grid; gap: 28px; }
.cta h2 { font-size: clamp(2.4rem, 8vw, 6.4rem); letter-spacing: -0.045em; max-width: 14ch; }

/* case study */
.back { display: inline-block; text-decoration: none; margin-bottom: 28px; }
.back:hover { color: var(--accent); }
.cs-h h1 { font-size: clamp(2.6rem, 8.4vw, 7rem); font-weight: 800; letter-spacing: -0.045em; max-width: 16ch; }
.cs-h .sum { font-size: clamp(1.15rem, 2vw, 1.5rem); max-width: 44ch; margin-top: 22px; line-height: 1.4; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 28px; margin-top: 40px; padding-block: 22px; border-block: 1px solid var(--line); }
.meta dt { margin-bottom: 6px; }
.meta dd { margin: 0; font-weight: 500; }
.cs-visual { margin-top: 36px; }
.cs-visual .plate { aspect-ratio: 16 / 9; }
.cs-note { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; padding-top: 16px; }
.cs-note p { color: var(--mute); font-size: 0.95rem; max-width: 56ch; }
.gal { columns: 3 260px; column-gap: 16px; margin-top: 28px; }
.gal figure { margin: 0 0 16px; break-inside: avoid; min-width: 0; }
.gal .gi { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; position: relative; box-shadow: 0 14px 30px rgba(8, 10, 20, .22), 0 0 0 1px rgba(8, 10, 20, .08); transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s; }
.gal .gi:hover { transform: translateY(-5px); }
.gal .gi img, .gal .gi video { width: 100%; height: auto; display: block; background: #fff; }
.gal figcaption { margin-top: 10px; }
.blk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 16px 48px; padding-block: clamp(28px, 4vw, 48px); border-top: 1px solid var(--line); }
.blk h2 { font: 400 0.75rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.blk p, .blk ul { font-size: clamp(1.1rem, 1.8vw, 1.35rem); line-height: 1.5; max-width: 46ch; margin: 0; }
.blk ul { list-style: none; padding: 0; display: grid; gap: 6px; }
.blk ul li::before { content: "\2192"; color: var(--accent); margin-right: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { border: 1px solid var(--ink); padding: 6px 14px; font-size: 0.95rem; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--line); margin-top: 24px; }
.pn a { text-decoration: none; padding-block: 28px; display: block; }
.pn a:last-child { text-align: right; }
.pn a b { display: block; font: 700 clamp(1.2rem, 3vw, 2rem) var(--font-display); letter-spacing: -0.025em; margin-top: 6px; }
.pn a:hover b { color: var(--accent); }

/* about */
.ab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: clamp(24px, 6vw, 96px); }
.ab .intro { font-size: clamp(1.3rem, 2.4vw, 1.8rem); line-height: 1.35; letter-spacing: -0.01em; }
.ab .intro + p { margin-top: 20px; color: var(--mute); max-width: 52ch; }
.facts { display: grid; gap: 0; margin-top: 28px; border-top: 1px solid var(--line); }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--mute); }
.facts dd { margin: 0; text-align: right; font-weight: 500; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 28px; padding-block: 22px; border-top: 1px solid var(--line); }
.tl li:last-child { border-bottom: 1px solid var(--line); }
.tl h3 { font-size: 1.3rem; letter-spacing: -0.02em; }
.tl .co { color: var(--mute); margin-top: 2px; }

    window.addEventListener("scroll", function () { sy = window.scrollY; var mxS = Math.max(1, document.documentElement.scrollHeight - window.innerHeight); document.getElementById("prog").style.transform = "scaleX(" + Math.min(1, sy / mxS).toFixed(4) + ")"; if (REDUCE) draw(); }, { passive: true });
    document.addEventListener("visibilitychange", function () { if (document.hidden) run = false; else if (!run) start(); });
    if (window.matchMedia) { var mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", function () { setTimeout(colors, 30); }); }
    size(); colors(); start();
    return { colors: colors };
  }
  /* ---------- 3D liquid mirror background (WebGL), continuous with page scroll ---------- */
  function bgGL() {
    var cv = document.getElementById("bg"), gl = null;
    try { gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" }); } catch (e) {}
    function bail() { var n = cv.cloneNode(false); cv.parentNode.replaceChild(n, cv); return null; }
    if (!gl) return null;
    var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    var FS = [
      "precision highp float;",
      "uniform vec2 R;uniform float T;uniform float S;uniform float L;uniform vec3 B;uniform vec3 M;",
      "vec2 pm;",
      "float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
      "float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}",
      "float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn(p);p=p*2.03+vec2(17.,9.);a*=.5;}return s;}",
      "float H(vec2 p){",
      " float t=T*.11;",
      " vec2 q=p+2.2*vec2(fbm(p*.35+vec2(0.,t))-.5,fbm(p*.35+vec2(7.3,-t))-.5);",
      " float f=sin(q.y*1.0+1.9*sin(q.x*.42+t*1.4)+t*.9);",
      " float band=exp(-f*f*3.4);",
      " float rip=(fbm(q*1.05+vec2(t*1.6,-t))-.5)*.5+.1*sin(q.x*2.3+q.y*1.7+T*.3);",
      " vec2 d=p-pm;",
      " float bump=M.z*.55*exp(-dot(d,d)*2.2);",
      " return band*(1.+rip*1.3)*1.25+bump*band;",
      "}",
      "vec3 pal(float c){c=fract(c)*5.;vec3 a=vec3(.12,.32,1.),b=vec3(.5,.22,1.),m=vec3(1.,.2,.7),o=vec3(1.,.55,.3),y=vec3(.2,.85,1.);float k=fract(c);k=k*k*(3.-2.*k);if(c<1.)return mix(a,b,k);if(c<2.)return mix(b,m,k);if(c<3.)return mix(m,o,k);if(c<4.)return mix(o,y,k);return mix(y,a,k);}",
      "void main(){",
      " vec2 fc=gl_FragCoord.xy;float u=4.4/R.y;",
      " vec2 p=vec2(fc.x,R.y-fc.y+S)*u;",
      " pm=vec2(M.x,R.y-M.y+S)*u;",
      " float e=.03;",
      " float h0=H(p);",
      " float hx=H(p+vec2(e,0.))-H(p-vec2(e,0.));",
      " float hy=H(p+vec2(0.,e))-H(p-vec2(0.,e));",
      " vec3 n=normalize(vec3(-hx,hy,e*2.3));",
      " float ndv=clamp(n.z,0.,1.);",
      " vec3 r=reflect(vec3(0.,0.,-1.),n);",
      " float env=smoothstep(.15,1.,.5+.5*sin(r.x*4.5+r.y*2.8+1.2));",
      " env+=pow(max(dot(r,normalize(vec3(.35,.55,.75))),0.),22.)*1.3;",
      " vec3 base=pal(ndv*1.1+r.x*.5+r.y*.3+T*.016+p.y*.03);",
      " vec3 col=base*(.12+1.1*env)+pow(1.-ndv,2.2)*pal(r.x*.7+.3)*.7;",
      " float a=smoothstep(.07,.42,h0);",
      " vec3 od=mix(B,min(col*.78,vec3(.92)),a);",
      " float lm=dot(col,vec3(.3,.5,.2));",
      " vec3 tn=mix(vec3(lm),col,.16)*vec3(.80,.83,.97);",
      " vec3 lc=mix(vec3(1.),tn,.62);",
      " vec3 ol=mix(B,lc,a*.46);",
      " vec3 o=mix(od,ol,L);",
      " o+=(h21(fc+fract(T))-.5)/200.;",
      " gl_FragColor=vec4(o,1.);",
      "}"
    ].join("\n");
    function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; }
    var v = sh(gl.VERTEX_SHADER, VS), f = sh(gl.FRAGMENT_SHADER, FS), pr = gl.createProgram();
    if (!v || !f) return bail();
    gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return bail();
    gl.useProgram(pr);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var U = {}; ["R", "T", "S", "L", "B", "M"].forEach(function (k) { U[k] = gl.getUniformLocation(pr, k); });
    var scale = 0.6, W = 0, Hh = 0, light = 0, bgc = [.05, .05, .06], t0 = performance.now(), run = false, last = 0, mz = 0, coarse = !FINE;
    function size() {
      scale = window.innerWidth < 700 ? 0.5 : 0.6; W = window.innerWidth; Hh = window.innerHeight;
      cv.width = Math.max(2, Math.round(W * scale)); cv.height = Math.max(2, Math.round(Hh * scale)); gl.viewport(0, 0, cv.width, cv.height); draw(performance.now());
    }
    function colors() {
      var cs = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(), c;
      if (cs.charAt(0) === "#") { if (cs.length === 4) cs = "#" + cs[1] + cs[1] + cs[2] + cs[2] + cs[3] + cs[3]; c = [parseInt(cs.substr(1, 2), 16), parseInt(cs.substr(3, 2), 16), parseInt(cs.substr(5, 2), 16)]; } else c = [12, 13, 16];
      bgc = [c[0] / 255, c[1] / 255, c[2] / 255]; light = (c[0] + c[1] + c[2]) > 380 ? 1 : 0; draw(performance.now());
    }
    function draw(now) {
      var sy = window.scrollY || 0, want = (mx > -999 && FINE) ? 1 : 0; mz += (want - mz) * 0.08;
      gl.uniform2f(U.R, cv.width, cv.height); gl.uniform1f(U.T, REDUCE ? 6 : (now - t0) / 1000); gl.uniform1f(U.S, sy * 0.5 * scale);
      gl.uniform1f(U.L, light); gl.uniform3f(U.B, bgc[0], bgc[1], bgc[2]);
      gl.uniform3f(U.M, mx * scale, Hh * scale - (Hh - my) * scale + 0, mz);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function frame(now) { if (!run) return; if (!coarse || now - last > 32) { last = now; draw(now); } requestAnimationFrame(frame); }
    function start() { if (REDUCE || run) return; run = true; requestAnimationFrame(frame); }
    cv.addEventListener("webglcontextlost", function (e) { e.preventDefault(); run = false; });
    cv.addEventListener("webglcontextrestored", function () { size(); start(); });
    window.addEventListener("resize", size);
    window.addEventListener("scroll", function () { var sy = window.scrollY, mxS = Math.max(1, document.documentElement.scrollHeight - window.innerHeight); document.getElementById("prog").style.transform = "scaleX(" + Math.min(1, sy / mxS).toFixed(4) + ")"; if (REDUCE) draw(performance.now()); }, { passive: true });
    document.addEventListener("visibilitychange", function () { if (document.hidden) run = false; else start(); });
    if (window.matchMedia) { var mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", function () { setTimeout(colors, 30); }); }
    size(); colors(); start();
    return { colors: colors };
  }
  var bg = bgGL() || bg2d();

  var clock = document.getElementById("clock");
  function tick() { try { clock.textContent = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Karachi", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()) + " PKT"; } catch (e) {} }
  tick(); setInterval(tick, 30000);
  window.addEventListener("hashchange", route);
  route();
})();
